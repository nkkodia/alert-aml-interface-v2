<!-- Pagination en bas du tableau -->
<div class="px-4 py-3 bg-gray-50 border-t border-gray-200 flex items-center justify-between">
  <div class="flex-1 flex justify-between sm:hidden">
    <button (click)="prevPage()" [disabled]="currentPage === 0" class="relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
      Previous
    </button>
    <button (click)="nextPage()" [disabled]="currentPage === totalPages - 1" class="ml-3 relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
      Next
    </button>
  </div>
  <div class="hidden sm:flex-1 sm:flex sm:items-center sm:justify-between">
    <div>
      <p class="text-sm text-gray-700">
        Showing <span class="font-medium">{{ (currentPage * currentFilters.size) + 1 }}</span> to <span class="font-medium">{{ (currentPage * currentFilters.size) + alerts.length }}</span> of <span class="font-medium">{{ totalElements }}</span> results
      </p>
    </div>
    <div>
      <nav class="relative z-0 inline-flex rounded-md shadow-sm -space-x-px" aria-label="Pagination">
        <button (click)="prevPage()" [disabled]="currentPage === 0" class="relative inline-flex items-center px-2 py-2 rounded-l-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50">
          <span class="sr-only">Previous</span>
          <i class="fas fa-chevron-left"></i>
        </button>
        @for (pageNum of getPageNumbers(); track pageNum) {
          <button (click)="goToPage(pageNum - 1)" [class.bg-primary]="pageNum - 1 === currentPage" [class.text-white]="pageNum - 1 === currentPage" [class.bg-white]="pageNum - 1 !== currentPage" [class.text-gray-700]="pageNum - 1 !== currentPage" class="relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium hover:bg-gray-50">
            {{ pageNum }}
          </button>
        }
        <button (click)="nextPage()" [disabled]="currentPage === totalPages - 1" class="relative inline-flex items-center px-2 py-2 rounded-r-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50">
          <span class="sr-only">Next</span>
          <i class="fas fa-chevron-right"></i>
        </button>
      </nav>
    </div>
  </div>
</div>
</div>
