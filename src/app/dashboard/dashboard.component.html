<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
  <div class="bg-white rounded-lg shadow p-4">
    <div class="flex items-center justify-between">
      <div>
        <p class="text-sm font-medium text-gray-500">Total Alerts</p>
        <p id="totalAlerts" class="text-2xl font-bold text-primary">{{ totalAlerts }}</p>
      </div>
      <div class="p-3 rounded-full bg-blue-100 text-primary">
        <i class="fas fa-bell"></i>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-2">+12% from last week</p>
  </div>
  <div class="bg-white rounded-lg shadow p-4">
    <div class="flex items-center justify-between">
      <div>
        <p class="text-sm font-medium text-gray-500">Open Alerts</p>
        <p id="openAlerts" class="text-2xl font-bold text-warning">{{ openAlerts }}</p>
      </div>
      <div class="p-3 rounded-full bg-yellow-100 text-warning">
        <i class="fas fa-exclamation-circle"></i>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-2">+5 from yesterday</p>
  </div>
  <div class="bg-white rounded-lg shadow p-4">
    <div class="flex items-center justify-between">
      <div>
        <p class="text-sm font-medium text-gray-500">False Positives</p>
        <p id="falsePositives" class="text-2xl font-bold text-danger">{{ falsePositives }}</p>
      </div>
      <div class="p-3 rounded-full bg-red-100 text-danger">
        <i class="fas fa-times-circle"></i>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-2">10% of total alerts</p>
  </div>
  <div class="bg-white rounded-lg shadow p-4">
    <div class="flex items-center justify-between">
      <div>
        <p class="text-sm font-medium text-gray-500">Avg Resolution Time</p>
        <p id="avgResolutionTime" class="text-2xl font-bold text-success">{{ avgResolutionTime }}</p>
      </div>
      <div class="p-3 rounded-full bg-green-100 text-success">
        <i class="fas fa-clock"></i>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-2">Days per alert</p>
  </div>
</div>

<div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
  <div class="bg-white rounded-lg shadow p-4">
    <div class="flex items-center justify-between mb-4">
      <h3 class="font-medium text-gray-800">Alerts by Type</h3>
      <select class="text-xs border border-gray-300 rounded px-2 py-1">
        <option>Last 7 days</option>
        <option>Last 30 days</option>
        <option>Last 90 days</option>
      </select>
    </div>
    <div class="chart-container">
      <canvas id="alertsByTypeChart"></canvas>
    </div>
  </div>
  <div class="bg-white rounded-lg shadow p-4">
    <div class="flex items-center justify-between mb-4">
      <h3 class="font-medium text-gray-800">Alerts by Status</h3>
      <select class="text-xs border border-gray-300 rounded px-2 py-1">
        <option>Last 7 days</option>
        <option>Last 30 days</option>
        <option>Last 90 days</option>
      </select>
    </div>
    <div class="chart-container">
      <canvas id="alertsByStatusChart"></canvas>
    </div>
  </div>
</div>
