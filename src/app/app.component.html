<div class="flex h-screen overflow-hidden">
  <!-- Sidebar -->
  <div class="sidebar bg-white w-64 border-r border-gray-200 flex flex-col" [class.open]="isSidebarOpen">
    <div class="p-4 border-b border-gray-200">
      <h1 class="text-xl font-bold text-primary flex items-center">
        <i class="fas fa-shield-alt mr-2"></i>
        AML Alert System
      </h1>
    </div>
    <nav class="flex-1 overflow-y-auto">
      <div class="p-4">
        <div class="mb-6">
          <h2 class="text-xs uppercase font-semibold text-gray-500 mb-2">Main</h2>
          <a href="#" class="flex items-center px-3 py-2 text-sm font-medium rounded-md text-gray-700 hover:bg-gray-100" [class.bg-blue-50]="activeSection === 'dashboard'" [class.text-primary]="activeSection === 'dashboard'" (click)="showSection('dashboard')">
            <i class="fas fa-tachometer-alt mr-3" [class.text-primary]="activeSection === 'dashboard'" [class.text-gray-500]="activeSection !== 'dashboard'"></i>
            Dashboard
          </a>
          <a href="#" class="flex items-center px-3 py-2 text-sm font-medium rounded-md mt-1" [class.bg-blue-50]="activeSection === 'alerts'" [class.text-primary]="activeSection === 'alerts'" (click)="showSection('alerts')">
            <i class="fas fa-bell mr-3" [class.text-primary]="activeSection === 'alerts'" [class.text-gray-500]="activeSection !== 'alerts'"></i>
            Alerts
          </a>
          <a href="#" class="flex items-center px-3 py-2 text-sm font-medium rounded-md mt-1" [class.bg-blue-50]="activeSection === 'emailLogs'" [class.text-primary]="activeSection === 'emailLogs'" (click)="showSection('emailLogs')">
            <i class="fas fa-envelope mr-3" [class.text-primary]="activeSection === 'emailLogs'" [class.text-gray-500]="activeSection !== 'emailLogs'"></i>
            Email Logs
          </a>
        </div>
        <div class="mb-6">
          <h2 class="text-xs uppercase font-semibold text-gray-500 mb-2">Reports</h2>
          <a href="#" class="flex items-center px-3 py-2 text-sm font-medium rounded-md text-gray-700 hover:bg-gray-100">
            <i class="fas fa-chart-bar mr-3 text-gray-500"></i>
            Statistics
          </a>
          <a href="#" class="flex items-center px-3 py-2 text-sm font-medium rounded-md text-gray-700 hover:bg-gray-100 mt-1">
            <i class="fas fa-file-export mr-3 text-gray-500"></i>
            Exports
          </a>
        </div>
        <div>
          <h2 class="text-xs uppercase font-semibold text-gray-500 mb-2">Settings</h2>
          <a href="#" class="flex items-center px-3 py-2 text-sm font-medium rounded-md text-gray-700 hover:bg-gray-100">
            <i class="fas fa-cog mr-3 text-gray-500"></i>
            Configuration
          </a>
          <a href="#" class="flex items-center px-3 py-2 text-sm font-medium rounded-md text-gray-700 hover:bg-gray-100 mt-1">
            <i class="fas fa-users mr-3 text-gray-500"></i>
            Users
          </a>
          <button (click)="triggerScan()" class="flex items-center px-3 py-2 text-sm font-medium rounded-md text-gray-700 hover:bg-gray-100 mt-1 w-full text-left">
            <i class="fas fa-sync-alt mr-3 text-gray-500"></i>
            Trigger Scan
          </button>
        </div>
      </div>
    </nav>
    <div class="p-4 border-t border-gray-200">
      <div class="flex items-center">
        <img class="w-8 h-8 rounded-full" src="https://placehold.co/32x32/cccccc/333333?text=JS" alt="User profile">
        <div class="ml-3">
          <p class="text-sm font-medium text-gray-700">Jane Smith</p>
          <p class="text-xs text-gray-500">Compliance Officer</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Main content -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <header class="bg-white border-b border-gray-200 flex items-center justify-between p-4">
      <div class="flex items-center">
        <button (click)="toggleSidebar()" class="md:hidden mr-4 text-gray-500">
          <i class="fas fa-bars"></i>
        </button>
        <h2 class="text-lg font-semibold text-gray-800">{{ title }}</h2>
      </div>
      <div class="flex items-center space-x-4">
        <div class="relative">
          <button class="text-gray-500 hover:text-gray-700">
            <i class="fas fa-search"></i>
          </button>
        </div>
        <button class="text-gray-500 hover:text-gray-700">
          <i class="fas fa-bell"></i>
          <span class="absolute top-0 right-0 h-2 w-2 rounded-full bg-red-500"></span>
        </button>
      </div>
    </header>

    <main class="flex-1 overflow-y-auto p-4">
      <app-loader></app-loader>
      <app-dashboard *ngIf="activeSection === 'dashboard'"></app-dashboard>
      <app-alerts *ngIf="activeSection === 'alerts'"></app-alerts>
      <app-email-logs *ngIf="activeSection === 'emailLogs'"></app-email-logs>
    </main>
  </div>
</div>
