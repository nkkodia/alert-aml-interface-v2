<div class="flex items-center justify-center min-h-screen bg-gray-100">
  <div class="w-full max-w-md bg-white rounded-lg shadow-lg p-8 space-y-6">
    <div class="text-center">
      <h2 class="text-3xl font-bold text-gray-800">
        Changer le mot de passe
      </h2>
      <p class="mt-2 text-sm text-gray-600">
        Veuillez remplir le formulaire pour mettre à jour votre mot de passe.
      </p>
    </div>

    <form (ngSubmit)="changePassword()" class="space-y-4">
      <div>
        <label for="oldPassword" class="block text-sm font-medium text-gray-700">Ancien mot de passe</label>
        <div class="mt-1">
          <input
            id="oldPassword"
            name="oldPassword"
            type="password"
            required
            [(ngModel)]="oldPassword"
            class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm"
          />
        </div>
      </div>

      <div>
        <label for="newPassword" class="block text-sm font-medium text-gray-700">Nouveau mot de passe</label>
        <div class="mt-1">
          <input
            id="newPassword"
            name="newPassword"
            type="password"
            required
            [(ngModel)]="newPassword"
            class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm"
          />
        </div>
      </div>

      <div>
        <label for="confirmNewPassword" class="block text-sm font-medium text-gray-700">Confirmer le nouveau mot de passe</label>
        <div class="mt-1">
          <input
            id="confirmNewPassword"
            name="confirmNewPassword"
            type="password"
            required
            [(ngModel)]="confirmNewPassword"
            class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm"
          />
        </div>
      </div>

      @if (message) {
        <div [ngClass]="{'text-green-500': isSuccess, 'text-red-500': !isSuccess}" class="text-sm font-bold text-center">
          {{ message }}
        </div>
      }

      <div>
        <button
          type="submit"
          class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-primary hover:bg-secondary"
        >
          Sauvegarder
        </button>
      </div>
    </form>
  </div>
</div>
