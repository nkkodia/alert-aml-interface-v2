<div class="flex items-center justify-center min-h-screen bg-gray-100">
  <div class="w-full max-w-md bg-white rounded-lg shadow-lg p-8 space-y-6">
    <div class="text-center">
      <h2 class="text-3xl font-bold text-gray-800">
        Créer un compte
      </h2>
      <p class="mt-2 text-sm text-gray-600">
        Remplissez le formulaire ci-dessous pour vous inscrire.
      </p>
    </div>

    <form (ngSubmit)="onRegister()" class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Adresse e-mail</label>
        <div class="mt-1">
          <input
            id="email"
            name="email"
            type="email"
            required
            [(ngModel)]="registrationRequest.email"
            class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm"
          />
        </div>
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Mot de passe</label>
        <div class="mt-1">
          <input
            id="password"
            name="password"
            type="password"
            required
            [(ngModel)]="registrationRequest.password"
            class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm"
          />
        </div>
      </div>
      <div>
        <label for="roles" class="block text-sm font-medium text-gray-700">Rôles</label>
        <div class="mt-1">
          <select
            id="roles"
            name="roles"
            multiple
            required
            [(ngModel)]="registrationRequest.roles"
            class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary sm:text-sm"
          >
            <option value="COMPLIANCE">COMPLIANCE</option>
            <option value="TREASURY">TREASURY</option>
            <option value="ADMIN">ADMIN</option>
          </select>
        </div>
      </div>

      <button
        type="submit"
        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-primary hover:bg-secondary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary"
      >
        S'inscrire
      </button>
    </form>

    <div *ngIf="message" class="text-center text-sm font-medium" [ngClass]="{'text-green-600': isSuccess, 'text-red-600': !isSuccess}">
      {{ message }}
    </div>

    <div class="text-center text-sm text-gray-600">
      <p>Déjà un compte ?</p>
      <a routerLink="/login" class="font-medium text-primary hover:text-secondary">
        Se connecter
      </a>
    </div>
  </div>
</div>
